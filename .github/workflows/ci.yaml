name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:

      - name: Get source code
        uses: actions/checkout@v7

      - name: Install llvm
        if: runner.os == 'Windows'
        run: |
          curl -o llvm-23.1.4.tar.xz -L https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.xz
          7z x llvm-23.1.4.tar.xz
          7z x llvm-23.1.4.tar
          move clang+llvm-23.1.4-x86_64-pc-windows-msvc ${{ runner.temp }}/llvm-23.1.4

      - name: Install llvm
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all

      - name: CMake configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_ROOT=${{ runner.temp }}\llvm-23.1.4 -DClang_ROOT=${{ runner.temp }}\llvm-23.1.4

      - name: Build
        run: cmake --build build --config Release --parallel
